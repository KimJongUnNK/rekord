<script>
  // apply per-device theme before first paint (no flash)
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem("rekord.device") || "{}");
      var t = p.theme || "system";
      if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
      if (p.density) document.documentElement.dataset.density = p.density;
    } catch (e) {}
  })();
</script>
