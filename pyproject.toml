[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rekord"
version = "1.0.8"
description = "Lokaler KI-Notizrekorder: aufnehmen, transkribieren, live erkennen wer spricht, zusammenfassen mit Claude/ChatGPT/Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sherpa-onnx>=1.12",
  "numpy>=1.26",
  "av>=12",
  "anthropic>=0.60",
  "openai>=1.40",
  "httpx>=0.27",
  "qrcode>=7.4",
  "zeroconf>=0.130",
  "cryptography>=42",
  "zstandard>=0.22; sys_platform == 'linux'",  # unpack Ollama for the one-click local AI
  # online meetings: the call's sound (Windows WASAPI loopback, Linux PulseAudio/PipeWire, macOS ScreenCaptureKit)
  "soundcard>=0.4.6; sys_platform != 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",
  "pyobjc-framework-CoreMedia>=10; sys_platform == 'darwin'",
  "pyobjc-framework-libdispatch>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
mcp = ["mcp>=1.2"]
docx = ["python-docx>=1.1"]
gpu = ["faster-whisper>=1.0"]
all = ["pywebview>=5", "mcp>=1.2", "python-docx>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.44", "pillow>=10", "soundfile>=0.12"]

[project.scripts]
rekord = "rekord.__main__:main"

[tool.setuptools.packages.find]
include = ["rekord*"]

[tool.setuptools.package-data]
rekord = ["web/*", "web/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs downloaded ONNX models (set REKORD_TEST_MODELS or allow download)"]
