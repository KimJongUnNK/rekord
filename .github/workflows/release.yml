name: release
# Push to the `release` branch (or a v* tag) → builds the Windows, macOS and Linux apps,
# then publishes GitHub Release v<version from pyproject.toml> (tag is created by the workflow).
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: REKORD-Windows-x64.zip
          - os: macos-15  # pinned: on 2026-11-04 GitHub's macos-latest pool left jobs unassigned until they were cancelled,
            asset: REKORD-macOS-AppleSilicon.zip  # while macos-15 ran at once
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[all]" pyinstaller pillow
      - name: build
        shell: bash
        run: |
          cd desktop
          pyinstaller rekord.spec --noconfirm > build.log 2>&1 || { echo "::error title=pyinstaller::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
          if [ "$RUNNER_OS" = "macOS" ]; then
            touch "$RUNNER_TEMP/built.stamp"
            echo "signature right after the build:"; codesign --verify --deep --strict --verbose=2 dist/REKORD.app 2>&1 | tail -3 || true
          fi
      - name: the packaged app opens its native window
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="desktop/dist/REKORD.app/Contents/MacOS/REKORD"; else BIN="desktop/dist/REKORD/REKORD.exe"; fi
          python scripts/window_smoke.py "$BIN" window-shots > window.log 2>&1 || { cat window.log; echo "::error title=window::$(tail -c 2500 window.log | tr -d '\r' | tr '\n%' ' _')"; exit 1; }
      - name: smoke test (packaged app serves the UI)
        shell: bash
        run: |
          cd desktop/dist
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="REKORD.app/Contents/MacOS/REKORD"; elif [ "$RUNNER_OS" = "Windows" ]; then BIN="REKORD/REKORD.exe"; else BIN="REKORD/REKORD"; fi
          export REKORD_HOME="$RUNNER_TEMP/rk" REKORD_PORT=8799 REKORD_LAN=0 REKORD_HEADLESS=1
          "./$BIN" > smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8799/api/status > /dev/null && break; sleep 2; done
          curl -sf localhost:8799/ | grep -q REKORD || { echo "::error title=smoke::$(tail -c 2500 smoke.log | tr '\n' ' ')"; exit 1; }
      - name: macOS – seal the app (the test runs above wrote into it; a broken signature means macOS never applies its permissions)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop/dist
          echo "files the test runs wrote into the app:"; find REKORD.app -newer "$RUNNER_TEMP/built.stamp" -type f | sed -n '1,20p'
          echo "($(find REKORD.app -newer "$RUNNER_TEMP/built.stamp" -type f | wc -l | tr -d ' ') files)"
          echo "signature after the test runs, before sealing:"; codesign --verify --deep --strict --verbose=2 REKORD.app 2>&1 | tail -4 || true
          find REKORD.app -name "__pycache__" -type d -prune -exec rm -rf {} +
          codesign --force --deep --sign - --identifier app.rekord.desktop REKORD.app
          codesign --verify --deep --strict --verbose=2 REKORD.app || { echo "::error title=signature::REKORD.app signature invalid after sealing"; exit 1; }
          codesign -d -r- REKORD.app 2>&1 | tail -2
      - name: package
        shell: bash
        run: |
          cd desktop/dist
          if [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent REKORD.app "../../${{ matrix.asset }}";
          else 7z a "../../${{ matrix.asset }}" REKORD > /dev/null; fi
      - uses: actions/upload-artifact@v7
        with: { name: "${{ matrix.asset }}", path: "${{ matrix.asset }}" }

  linux-build:
    # Debian 11 base (glibc 2.31) → the binary runs on Debian 11+, Ubuntu 20.04+, Fedora, openSUSE, Arch, Mint, Pop!_OS …
    runs-on: ubuntu-latest
    container: python:3.12-bullseye
    steps:
      - uses: actions/checkout@v7
      - name: Qt's X11 and sound libraries, so they travel inside the app (libxcb-cursor0 & co. are missing on many desktops)
        run: |
          PKGS="libpulse0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
                libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libegl1 libgl1 libfontconfig1 libdbus-1-3 xvfb xauth"
          SRC="/etc/apt/sources.list $(ls /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true)"
          get() { apt-get -o Acquire::Check-Valid-Until=false update -q >> apt.log 2>&1 && apt-get install -y -q $PKGS >> apt.log 2>&1; }
          edit() { for f in $SRC; do if [ -f "$f" ]; then sed -i "$@" "$f"; fi; done; }
          # Debian 11 is leaving the regular mirrors (its support ended): fall back step by step
          get || {
            echo "--- security updates from archive.debian.org" >> apt.log
            edit -e 's|//[a-z.]*debian.org/debian-security|//archive.debian.org/debian-security|g'
            get
          } || {
            echo "--- without the security suite" >> apt.log
            edit -e '/^deb .*debian-security/d' -e 's/ bullseye-security//'
            get
          } || {
            echo "--- everything from archive.debian.org" >> apt.log
            edit -e 's|//deb.debian.org/debian|//archive.debian.org/debian|g' -e '/^deb .*bullseye-updates/d' -e 's/ bullseye-updates//'
            get
          } || { echo "::error title=apt::$(tail -c 2500 apt.log | tr '\n' ' ')"; exit 1; }
      # glibc 2.31 here: pip takes the newest Qt for Python built for it (6.9) – runs on Debian 11+, Ubuntu 20.04+ …
      - run: pip install ".[mcp,docx]" "PySide6>=6.8" pyinstaller pillow
      - name: build
        run: |
          cd desktop
          pyinstaller rekord.spec --noconfirm > build.log 2>&1 || { echo "::error title=pyinstaller::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
          tar -C dist -czf ../rekord-linux-dist.tar.gz REKORD
      - name: the packaged app opens its native window (X server)
        run: |
          xvfb-run -a -s "-screen 0 1440x960x24" python scripts/window_smoke.py desktop/dist/REKORD/REKORD window-shots > window.log 2>&1 \
            || { cat window.log; echo "::error title=window linux::$(tail -c 2500 window.log | tr '\n%' ' _')"; exit 1; }
      - uses: actions/upload-artifact@v7
        with: { name: linux-dist, path: rekord-linux-dist.tar.gz }

  linux-package:
    needs: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: linux-dist }
      - name: tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rpm zstd libarchive-tools
          sudo gem install --no-document fpm
      - name: package (AppImage, deb, rpm, pacman, tar.gz, PKGBUILD)
        run: |
          mkdir -p dist && tar -C dist -xzf rekord-linux-dist.tar.gz
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          packaging/linux/build.sh dist/REKORD "$VER" linux-out
      - name: install + start on real distros
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          t() { docker run --rm --network host -v "$PWD/linux-out:/pkgs:ro" -v "$PWD/packaging/linux/test-in-distro.sh:/t.sh:ro" \
                  -e APPIMAGE_EXTRACT_AND_RUN=1 "$1" bash /t.sh "$2" "$3" || { echo "::error title=$1::install/start failed"; exit 1; }; }
          t debian:bullseye      "dpkg -i /pkgs/rekord_${VER}_amd64.deb" 8801
          t ubuntu:24.04         "dpkg -i /pkgs/rekord_${VER}_amd64.deb" 8802
          # the commands the guide and install.sh give users (RPM 6 refuses unsigned packages with a bare rpm -i)
          t fedora:latest        "dnf install -y /pkgs/rekord-${VER}-1.x86_64.rpm" 8803
          t opensuse/tumbleweed  "zypper --non-interactive install --allow-unsigned-rpm /pkgs/rekord-${VER}-1.x86_64.rpm" 8804
          t archlinux:latest     "pacman -U --noconfirm /pkgs/rekord-${VER}-1-x86_64.pkg.tar.zst" 8805
          t fedora:latest        "install -m755 /pkgs/REKORD-${VER}-x86_64.AppImage /usr/local/bin/rekord" 8806
      - name: AUR PKGBUILD builds with makepkg
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          docker run --rm -v "$PWD/linux-out:/pkgs:ro" archlinux:latest bash -c "
            pacman -Sy --noconfirm --needed fakeroot binutils debugedit >/dev/null &&
            useradd -m b && mkdir /home/b/p && cp /pkgs/PKGBUILD /pkgs/REKORD-${VER}-Linux-x86_64.tar.gz /home/b/p/ && chown -R b /home/b/p &&
            su b -c 'cd /home/b/p && makepkg -f --noconfirm' && pacman -U --noconfirm /home/b/p/rekord-bin-*.pkg.tar.zst && rekord models list | head -1"
      - uses: actions/upload-artifact@v7
        with: { name: linux-packages, path: linux-out/* }

  publish:
    needs: [desktop, linux-package]
    # never a release without the desktop apps: "latest" would then have no Mac (or Windows) download, and the one-line
    # installer would fail. Linux may be missing (then it's added by a re-run of the failed job).
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: drop build intermediates, add the one-line installers
        run: rm -f dist/rekord-linux-dist.tar.gz && cp packaging/install.sh packaging/install.ps1 dist/
      - id: v
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: remove assets that are no longer built
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | while read -r a; do
            [ -f "dist/$a" ] || gh release delete-asset "${{ steps.v.outputs.tag }}" "$a" --repo "$GITHUB_REPOSITORY" -y
          done
      - name: release page text (docs/RELEASE_NOTES.md with the version filled in)
        run: sed "s/{{VERSION}}/${TAG#v}/g" docs/RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
        env: { TAG: "${{ steps.v.outputs.tag }}" }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: REKORD ${{ steps.v.outputs.tag }}
          make_latest: true
          overwrite_files: true
