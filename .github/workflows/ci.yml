name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[all,dev]"
      - name: virtual speaker for the online-meeting test, Qt libraries for the window tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q pulseaudio pulseaudio-utils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: unit + api tests
        shell: bash
        run: |
          pytest -m "not models" -q -rfs --tb=line > unit.log 2>&1 || { echo "::error title=tests::$(grep -E '^(FAILED|ERROR)|Error|assert' unit.log | tail -c 3000 | tr -d '\r' | tr '\n%' ' _')"; exit 1; }
          echo "::notice title=tests ${{ runner.os }}::$(grep -E '^SKIPPED|passed' unit.log | tr -d '\r' | tr '\n%' ' _' | cut -c1-900)"
      - name: native window – every page with demo data (screenshots in the artifacts)
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen python scripts/ui_preview.py ui-preview > ui.log 2>&1 || { cat ui.log; echo "::error title=window ${{ runner.os }}::$(tail -c 2000 ui.log | tr -d '\r' | tr '\n%' ' _')"; exit 1; }
          echo "::notice title=window ${{ runner.os }}::$(grep 'UI preview' ui.log)"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "ui-preview-${{ runner.os }}", path: ui-preview/, if-no-files-found: ignore }
      - name: online meetings – call sound on the real OS (WASAPI / ScreenCaptureKit / Pulse)
        shell: bash
        run: |
          set +e
          python scripts/capture_smoke.py > capture.log 2>&1; rc=$?
          cat capture.log
          if [ $rc -ne 0 ]; then echo "::error title=call sound ${{ runner.os }}::$(tail -c 2500 capture.log | tr -d '\r' | tr '\n%' ' _')"; exit 1; fi
          echo "::notice title=call sound ${{ runner.os }}::$(tr '\n' ' ' < capture.log | cut -c1-900)"
      - name: end-to-end with real models (downloads ~250 MB)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/make_test_audio.py > e2e.log 2>&1 && pytest -m models -q -rs >> e2e.log 2>&1 || { echo "::error title=e2e::$(tail -c 3000 e2e.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=e2e::$(grep -E '^SKIPPED|passed' e2e.log | tr -d '\r' | tr '\n%' ' _' | cut -c1-900)"
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: cd ios && xcodebuild -project Rekord.xcodeproj -scheme Rekord -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[all]" pyinstaller pillow
      - name: Linux – Qt's system libraries (they travel inside the app) + an X server for the window test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libpulse0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1
      - name: build
        shell: bash
        run: |
          cd desktop
          pyinstaller rekord.spec --noconfirm > build.log 2>&1 || { echo "::error title=pyinstaller::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
          du -sh dist/* | tr '\n' ' '
      - name: the packaged app opens its native window (double-click start, every page, screenshots)
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "macOS" ]; then BIN="desktop/dist/REKORD.app/Contents/MacOS/REKORD"; elif [ "$RUNNER_OS" = "Windows" ]; then BIN="desktop/dist/REKORD/REKORD.exe"; else BIN="desktop/dist/REKORD/REKORD"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a -s '-screen 0 1440x960x24'"; else RUN=""; fi
          eval $RUN python scripts/window_smoke.py "$BIN" window-shots > window.log 2>&1; rc=$?
          cat window.log
          if [ $rc -ne 0 ]; then echo "::error title=window ${{ runner.os }}::$(tail -c 2500 window.log | tr -d '\r' | tr '\n%' ' _')"; exit 1; fi
          echo "::notice title=window ${{ runner.os }}::$(grep -E 'UI selftest|OK' window.log | tr -d '\r' | tr '\n' ' ')"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "window-shots-${{ runner.os }}", path: window-shots/, if-no-files-found: ignore }
      - name: started like a double-click (Windows, no console) – the hub must answer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:REKORD_HOME = "$env:RUNNER_TEMP\dc"; $env:REKORD_PORT = "8798"; $env:REKORD_LAN = "0"; $env:REKORD_HEADLESS = "1"
          $p = Start-Process -FilePath "desktop\dist\REKORD\REKORD.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) { Start-Sleep 2; try { Invoke-RestMethod http://127.0.0.1:8798/api/status | Out-Null; $ok = $true } catch {} }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "::error title=double-click::REKORD started without a console does not answer"; exit 1 }
          Write-Host "::notice title=double-click::REKORD started without a console answers"
      - name: real in-app update (an old REKORD replaces itself with this build – same place, one process)
        shell: bash
        run: |
          set +e
          python scripts/update_smoke.py desktop/dist > update.log 2>&1; rc=$?
          cat update.log
          if [ $rc -ne 0 ]; then echo "::error title=update ${{ runner.os }}::$(tail -c 2500 update.log | tr -d '\r' | tr '\n%' ' _')"; exit 1; fi
          echo "::notice title=update ${{ runner.os }}::$(grep -E 'check:|now running|processes|OK' update.log | tr '\n' ' ' | cut -c1-900)"
      - uses: actions/upload-artifact@v7
        with:
          name: REKORD-${{ runner.os }}
          path: desktop/dist/
  ollama-real:
    # the one-click local AI against the real thing: official Ollama download + install, start, model pull, answer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: install Ollama from inside REKORD, pull a model, summarize
        shell: bash
        run: |
          set +e
          python scripts/ollama_smoke.py qwen3:0.6b > ollama.log 2>&1; rc=$?
          cat ollama.log
          if [ $rc -ne 0 ]; then echo "::error title=ollama ${{ runner.os }}::$(tail -c 2500 ollama.log | tr '\n' ' ')"; exit 1; fi
          echo "::notice title=ollama ${{ runner.os }}::$(grep -E '^(installed|running|answer|OK)' ollama.log | tr '\n' ' ' | cut -c1-900)"
  installers:
    # the one-line installers (against the latest published release)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux distros (install.sh as root → native package)
        if: runner.os == 'Linux'
        run: |
          t() { docker run --rm -v "$PWD/packaging/install.sh:/i.sh:ro" "$1" sh -c "$2 >/dev/null 2>&1; sh /i.sh && rekord models list | head -2" \
                  || { echo "::error title=install.sh $1::failed"; exit 1; }; }
          t debian:bookworm      "apt-get update -q && apt-get install -y -q curl ca-certificates"
          t fedora:latest        "dnf install -y -q curl"
          t opensuse/tumbleweed  "zypper -n in curl"
          t archlinux:latest     "pacman -Sy --noconfirm curl"
      - name: macOS (install.sh → /Applications, no quarantine)
        if: runner.os == 'macOS'
        run: |
          sh packaging/install.sh
          test -x /Applications/REKORD.app/Contents/MacOS/REKORD
          ! xattr -p com.apple.quarantine /Applications/REKORD.app 2>/dev/null
          sleep 5; osascript -e 'tell application "REKORD" to quit' || true
      - name: Windows (install.ps1 → user install + shortcuts)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/install.ps1
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\REKORD\REKORD.exe")) { throw "exe missing" }
          if (-not (Test-Path ([Environment]::GetFolderPath("Programs") + "\REKORD.lnk"))) { throw "start menu shortcut missing" }
          Start-Sleep 5; Get-Process REKORD -ErrorAction SilentlyContinue | Stop-Process -Force
