name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[all,dev]"
      - name: unit + api tests
        shell: bash
        run: pytest -m "not models" -q -rf --tb=line > unit.log 2>&1 || { echo "::error title=tests::$(tail -c 3000 unit.log | tr '\n' ' ')"; exit 1; }
      - name: end-to-end with real models (downloads ~250 MB)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python scripts/make_test_audio.py > e2e.log 2>&1 && pytest -m models -q >> e2e.log 2>&1 || { echo "::error title=e2e::$(tail -c 3000 e2e.log | tr '\n' ' ')"; exit 1; }
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - run: cd ios && xcodebuild -project Rekord.xcodeproj -scheme Rekord -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[all]" pyinstaller pillow
      - name: build
        shell: bash
        run: |
          cd desktop
          pyinstaller rekord.spec --noconfirm > build.log 2>&1 || { echo "::error title=pyinstaller::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: REKORD-${{ runner.os }}
          path: desktop/dist/
